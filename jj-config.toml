"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[user]
name = "Charlie Luo"
email = "cvxluo@gmail.com"

# Default to showing my commits + remote tracking bookmarks in `jj log`
[revsets]
log = 'mine() | present(main@origin) | present(master@origin)'
# Priority set for short change-id prefixes. Must stay cheap — it's evaluated on EVERY
# command (short-prefixes falls back to revsets.log when unset, so an unbounded mine()
# here would scan all commits per command). Covers @, trunk, and all branch commits.
short-prefixes = '@ | trunk() | (trunk()..bookmarks())'

# Shortcut to view all commits
[aliases]
log-all = ["log", "-r", "all()"]
# Move bookmarks from ancestor heads to the parent commit
tug = ["bookmark", "move", "--from", "heads(::@- & bookmarks())", "--to", "@-"]
prune-mega = ["rebase", "-r", "@", "-o", "heads(trunk() | (parents(@) ~ ::trunk()))"]

[templates]
# Auto-generate bookmark names from commit message description,
# falling back to change_id if no description exists.
# e.g. "feat(scope): Add foo bar" -> "cvxluo/add-foo-bar"
git_push_bookmark = '''
if(
  description.first_line().replace(regex:"^[^:]+:\\s*", "").len() > 0,
  "cvxluo/" ++ description.first_line()
    .replace(regex:"^[^:]+:\\s*", "")
    .lower()
    .replace("_", "-")
    .replace(regex:"[^a-z0-9 -]", "")
    .replace(" ", "-")
    .replace(regex:"-{2,}", "-")
    .replace(regex:"^-|-$", "")
    .substr(0, 50),
  "cvxluo/" ++ change_id.short()
)
'''
